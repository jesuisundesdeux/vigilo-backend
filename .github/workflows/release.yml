name: Release image

# Pushing a tag vX.Y.Z publishes:
# - a GitHub release with the update archive used by the admin updater
#   (vigilo-backend-X.Y.Z.zip, SHA256SUMS, and a .sig when the secret
#   VIGILO_RELEASE_SIGNING_KEY is set, see scripts/release-keygen.php)
# - the Docker image with the tags X.Y.Z, X.Y, stable and latest, signed with
#   cosign (keyless)
# - the blur server image (blur-server/, ghcr.io/<owner>/vigilo-blur, and
#   vigilobs/vigilo-blur on Docker Hub) with the same tags, signed too
# Docker Hub (vigilobs/vigilo-backend) needs the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets; the GitHub registry needs nothing.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the code version
        run: |
          VERSION=$(sed -n "s/^define('BACKEND_VERSION', '\([0-9.]*\)');/\1/p" app/includes/version.php)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/includes/version.php ($VERSION)"
            exit 1
          fi

      - name: Registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGES="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            IMAGES="$IMAGES
          vigilobs/vigilo-backend"
          else
            echo "::warning::DOCKERHUB_USERNAME not set: image only published on ghcr.io"
          fi
          {
            echo 'images<<EOF'
            echo "$IMAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "dockerhub=$([ -n "$DOCKERHUB_USERNAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Update archive installed by the admin updater (classic installs)
      - name: Build update archive
        env:
          VIGILO_RELEASE_SIGNING_KEY: ${{ secrets.VIGILO_RELEASE_SIGNING_KEY }}
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.registries.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VIGILO_IMAGE_VERSION=${{ github.ref_name }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for TAG in $TAGS; do
            cosign sign --yes "${TAG%%:*}@${DIGEST}"
          done

  blur-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGES="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vigilo-blur"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            IMAGES="$IMAGES
          vigilobs/vigilo-blur"
          fi
          {
            echo 'images<<EOF'
            echo "$IMAGES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "dockerhub=$([ -n "$DOCKERHUB_USERNAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.registries.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: blur-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for TAG in $TAGS; do
            cosign sign --yes "${TAG%%:*}@${DIGEST}"
          done
