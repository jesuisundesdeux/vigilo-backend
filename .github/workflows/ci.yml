name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Syntax check (deprecations of the syntax refused too)
        run: |
          find app scripts -name '*.php' -print0 \
            | xargs -0 -n1 php -d error_reporting=-1 -d display_errors=1 -l > /tmp/lint.log 2>&1 || { grep -v '^No syntax errors' /tmp/lint.log; exit 1; }
          if grep -v '^No syntax errors' /tmp/lint.log | grep -q .; then grep -v '^No syntax errors' /tmp/lint.log; exit 1; fi
      - name: Problem rules (zones, form)
        run: php tests/problems/unit.php

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version file and migrations agree
        run: |
          VERSION=$(sed -n "s/^define('BACKEND_VERSION', '\([0-9.]*\)');/\1/p" app/includes/version.php)
          echo "Version: $VERSION"
          test -n "$VERSION"
          LAST=$(ls app/migrations/init-*.sql | sed 's/.*init-//;s/\.sql$//' | sort -V | tail -1)
          if [ "$(printf '%s\n%s\n' "$LAST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::Migration $LAST is newer than the code version $VERSION"
            exit 1
          fi
          grep -q "'$LAST' WHERE" app/migrations/init-$LAST.sql

  migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vigilo
          MARIADB_USER: vigilo
          MARIADB_PASSWORD: vigilo
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: vigilo
      MYSQL_PASSWORD: vigilo
      MYSQL_DATABASE: vigilo
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'
          extensions: mysqli
          tools: none
      - name: Install from an empty database
        run: |
          cp config/config.php.docker app/config/config.php
          php scripts/vigilo-migrate.php --status | grep -q '^0.0.0 '
          php scripts/vigilo-migrate.php
          php scripts/vigilo-migrate.php --status | awk '{ exit ($1 == $2) ? 0 : 1 }'
      - name: Migrations are re-runnable
        run: php scripts/vigilo-migrate.php | grep -q 'Base à jour'
      # schema-0.0.17.sql replaces the migrations 0.0.2 to 0.0.17 (issue #328): same
      # tables, indexes and settings as the former migrations of the last tag that had them
      - name: Schema 0.0.17 equals the former migrations 0.0.2 to 0.0.17
        run: |
          git fetch -q --depth=1 origin tag v0.0.31
          mkdir -p /tmp/old && git archive v0.0.31 app/migrations | tar -x -C /tmp/old
          mysql -h 127.0.0.1 -uroot -proot -e 'DROP DATABASE IF EXISTS old17; CREATE DATABASE old17; DROP DATABASE vigilo; CREATE DATABASE vigilo'
          for V in $(ls /tmp/old/app/migrations/init-*.sql | sed 's/.*init-//;s/\.sql$//' | sort -V); do
            if [ "$(printf '%s\n%s\n' "$V" 0.0.17 | sort -V | tail -1)" = "0.0.17" ]; then
              cat mysql/pre_sql.sql /tmp/old/app/migrations/init-$V.sql
              echo
            fi
          done | grep -v '^[[:space:]]*--' | mysql -h 127.0.0.1 -uroot -proot old17
          php scripts/vigilo-migrate.php --to=0.0.17
          dump() { mysqldump -h 127.0.0.1 -uroot -proot --no-data --skip-comments --compact "$1" | sed 's/ AUTO_INCREMENT=[0-9]*//'; }
          settings() { mysql -h 127.0.0.1 -uroot -proot -N "$1" -e 'SELECT config_param, config_value FROM obs_config ORDER BY config_param'; }
          diff <(dump old17) <(dump vigilo)
          diff <(settings old17) <(settings vigilo)
      - name: Refuse a database older than 0.0.17
        run: |
          mysql -h 127.0.0.1 -uroot -proot vigilo -e "UPDATE obs_config SET config_value='0.0.16' WHERE config_param='vigilo_db_version'"
          set +e
          php scripts/vigilo-migrate.php 2>&1 | tee /tmp/old.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" = "1"
          grep -q "plus ancienne que la 0.0.17" /tmp/old.log
          test "$(mysql -h 127.0.0.1 -uroot -proot vigilo -N -e "SELECT config_value FROM obs_config WHERE config_param='vigilo_db_version'")" = "0.0.16"
      - name: Upgrade from every released version
        run: |
          VERSIONS=$(ls app/migrations/init-*.sql | sed 's/.*init-//;s/\.sql$//' | sort -V)
          for FROM in 0.0.17 0.0.18 0.0.19 0.0.20 0.0.21 0.0.22; do
            mysql -h 127.0.0.1 -uroot -proot -e 'DROP DATABASE vigilo; CREATE DATABASE vigilo'
            {
              cat app/migrations/schema-0.0.17.sql
              echo
              for V in $VERSIONS; do
                if [ "$(printf '%s\n%s\n' "$V" "$FROM" | sort -V | tail -1)" = "$FROM" ]; then
                  cat mysql/pre_sql.sql app/migrations/init-$V.sql
                  echo
                fi
              done
            } | grep -v '^[[:space:]]*--' | mysql -h 127.0.0.1 -uroot -proot vigilo
            echo "From $(php scripts/vigilo-migrate.php --status)"
            php scripts/vigilo-migrate.php
          done
      - name: SGBlur setting kept as the blur server
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e 'DROP DATABASE vigilo; CREATE DATABASE vigilo'
          php scripts/vigilo-migrate.php --to=0.0.21
          mysql -h 127.0.0.1 -uroot -proot vigilo -e "UPDATE obs_config SET config_value='http://sgblur:8001/blur/' WHERE config_param='sgblur_url'"
          php scripts/vigilo-migrate.php
          test "$(mysql -h 127.0.0.1 -uroot -proot vigilo -N -e "SELECT config_value FROM obs_config WHERE config_param='vigilo_blur_url'")" = "http://sgblur:8001/blur/"
          test "$(mysql -h 127.0.0.1 -uroot -proot vigilo -N -e "SELECT COUNT(*) FROM obs_config WHERE config_param='sgblur_url'")" = "0"
      - name: Step by step upgrade
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e 'DROP DATABASE vigilo; CREATE DATABASE vigilo'
          php scripts/vigilo-migrate.php --to=0.0.17
          php scripts/vigilo-migrate.php --status | grep -q '^0.0.17 '
          php scripts/vigilo-migrate.php
      - name: Refuse a database newer than the code
        run: |
          mysql -h 127.0.0.1 -uroot -proot vigilo -e "UPDATE obs_config SET config_value='99.0.0' WHERE config_param='vigilo_db_version'"
          set +e
          php scripts/vigilo-migrate.php
          test $? -eq 2

  # API contract: the web app and mobile apps must see the same API as with the last
  # release (tests/api/snapshots.json), on the new image and on PHP 7.3 (shared hosting).
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [image, php73]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vigilo
          MARIADB_USER: vigilo
          MARIADB_PASSWORD: vigilo
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: vigilo
      MYSQL_PASSWORD: vigilo
      MYSQL_DATABASE: vigilo
      MYSQL_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          tools: none
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        if: matrix.runtime == 'image'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vigilo-backend:ci
      - name: Contract tests
        run: |
          if [ "${{ matrix.runtime }}" = "image" ]; then IMAGE=vigilo-backend:ci; else IMAGE=vigilobs/vigilo-backend:0.0.20; fi
          ADMIN_SMOKE=1 tests/api/run.sh app "$IMAGE"

  # Functional tests of the API (tests/api/functional.py): behaviour of every call,
  # checked with assertions on a fresh database — creation, photo, moderation,
  # publication, update, deletion, filters, formats, pixelation, resolutions,
  # anti-spam, protection of the private directories.
  functional:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [image, php73]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vigilo
          MARIADB_USER: vigilo
          MARIADB_PASSWORD: vigilo
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: vigilo
      MYSQL_PASSWORD: vigilo
      MYSQL_DATABASE: vigilo
      MYSQL_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          tools: none
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        if: matrix.runtime == 'image'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vigilo-backend:ci
      - name: Functional tests
        run: |
          if [ "${{ matrix.runtime }}" = "image" ]; then IMAGE=vigilo-backend:ci; else IMAGE=vigilobs/vigilo-backend:0.0.20; fi
          tests/api/run.sh app "$IMAGE" --functional

  # Blur server (blur-server/): detection and masking of faces and licence plates, then
  # docker-compose.yml with the "blur" profile end to end (photo sent by the backend,
  # stored with its face and plates masked)
  blur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          pip install -r blur-server/requirements.txt
          python -m unittest discover -s blur-server/tests -v
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vigilo-backend:ci
      - name: Build blur image
        uses: docker/build-push-action@v6
        with:
          context: blur-server
          load: true
          tags: vigilo-blur:ci
      - name: docker-compose with the blur server
        run: tests/blur/compose.sh vigilo-backend:ci vigilo-blur:ci

  # Admin updater, end to end: signed release installed, tampered archive refused,
  # broken migration rolled back (code and database)
  updater:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vigilo
          MARIADB_USER: vigilo
          MARIADB_PASSWORD: vigilo
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: vigilo
      MYSQL_PASSWORD: vigilo
      MYSQL_DATABASE: vigilo
      MYSQL_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, gd, curl, zip, sodium
          tools: none
      - name: Updater test
        run: tests/update/run.sh

  # Install assistant (admin/setup.php), end to end: empty database, no configuration
  setup:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vigilo
          MARIADB_USER: vigilo
          MARIADB_PASSWORD: vigilo
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: vigilo
      MYSQL_PASSWORD: vigilo
      MYSQL_DATABASE: vigilo
      MYSQL_ROOT_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli, gd, exif, curl, zip
          tools: none
      - name: Setup test
        run: tests/setup/run.sh
